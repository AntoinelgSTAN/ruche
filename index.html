<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>La Ruche · Voyages au pays des maths</title>
<style>
:root{--navy:#11264e;--blue:#2c57b1;--sky:#e3ecfb;--yellow:#ffcc08;--arte:#fa4b22;--bg:#f5f8fd;--card:#fff;--muted:#4d5c72}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--navy);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px 28px;background:var(--card);border-bottom:5px solid var(--yellow)}
.brand{display:flex;align-items:center;gap:20px}
.brand img{height:92px;width:auto}
.brand h1{margin:0;font-size:clamp(26px,2.8vw,42px)}
.brand p{margin:4px 0 0;font-size:17px}
.right{display:flex;align-items:center;gap:14px}
.arte{background:var(--arte);color:#fff;font-size:clamp(22px,2.4vw,34px);font-weight:900;letter-spacing:-2px;padding:10px 18px;transform:skew(-5deg)}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:14px;min-height:60px;padding:12px 22px;background:var(--sky);color:var(--navy);touch-action:manipulation}
button.primary{background:var(--blue);color:#fff}
button:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,2.2fr) minmax(320px,1fr);gap:22px;padding:20px 28px}
.stage{display:flex;flex-direction:column;gap:14px;min-width:0}
.player{background:#081831;border-radius:18px;padding:10px}
.frame{width:100%;aspect-ratio:16/9;max-width:100%;border-radius:10px;overflow:hidden;background:#050b18}
.frame iframe{width:100%;height:100%;border:0;display:block}
.now{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.now h2{margin:0;font-size:clamp(22px,2.2vw,32px);text-wrap:balance}
.now .ctrl{display:flex;gap:10px;flex-wrap:wrap}
.help{margin:0;color:var(--muted);font-size:15px}
.help a{color:var(--blue)}
aside{background:var(--card);border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:0 8px 22px #12295014}
aside h3{margin:0;padding:16px 20px 10px;font-size:20px}
ol{list-style:none;margin:0;padding:0 10px 12px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
li button{width:100%;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;text-align:left;background:transparent;border-radius:12px;padding:10px 12px;min-height:66px;font-weight:650;font-size:18px;line-height:1.25}
li button .n{background:var(--sky);border-radius:10px;height:40px;display:grid;place-items:center;font-weight:900}
li button .d{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
li button[aria-current="true"]{background:#fff4c2}
li button[aria-current="true"] .n{background:var(--yellow)}
body.big header,body.big aside{display:none}
body.big main{grid-template-columns:1fr;padding:8px}
body.big .frame{aspect-ratio:auto;height:calc(100vh - 110px)}
@media(max-width:950px){main{grid-template-columns:1fr}aside{max-height:none}.brand img{height:64px}.arte{display:none}}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style>
